<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a company on SecMox</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/secmox.css">

<body>
<a class="skip-link" href="#main">Skip to content</a>


<main id="main" tabindex="-1" class="wrap join-wrap">
  <a class="brand" href="/" aria-label="SecMox home">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" fill="none" stroke="#29B6FF" stroke-width="2"/><path d="M11 13 L16 10 L21 13 V19 L16 22 L11 19 Z" fill="#29B6FF"/></svg>

  </a>

  <section class="join-card">
    <p class="kicker">&gt; invitation</p>
    <h1 id="joinTitle">Checking your invite</h1>
    <p class="sub" id="joinBody">One moment.</p>
    <div class="actions" id="joinActions" hidden></div>
    <p class="msg" id="joinMsg"></p>
  </section>
</main>

<script type="module" src="/js/join.js"></script>
