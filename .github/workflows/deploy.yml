name: Deploy

# Cloudflare's own git integration stopped delivering push events for this
# repository, so deployment runs here instead: visible logs, re-runnable, and
# triggerable by hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wrangler 4 requires Node 22.12 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the bundle and bindings without touching the account
        run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
